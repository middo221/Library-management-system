# The whole system on Postgres, in two containers.
#
#   docker compose up --build   →  http://localhost:8000
#
# The app container serves the API and the built SPA from the same origin, so there is no
# CORS configuration to get wrong.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-compose-secret-change-me}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,app
      # Compose serves over plain HTTP on localhost; keep the redirect off or every request loops.
      SECURE_SSL_REDIRECT: "False"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: library
      DB_USER: library
      DB_PASSWORD: library
      DB_HOST: db
      DB_PORT: "5432"
      SEED_DEMO_DATA: "true"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
